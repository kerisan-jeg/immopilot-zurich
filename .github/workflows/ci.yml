name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight subset sufficient to import the numeric + feature modules.
          pip install numpy pandas scikit-learn xgboost joblib python-dotenv pyyaml ruff

      - name: Lint changed code (non-blocking, informational)
        run: ruff check src/ app/ || true

      - name: Smoke test — core modules import
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
        run: |
          python -c "import immopilot.config; print('config OK')"
          python -c "from immopilot.features import build_features; print('features OK')"
          python -c "from immopilot.models import _common; print('models OK')"
