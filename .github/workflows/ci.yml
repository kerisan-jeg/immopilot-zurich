name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight subset: enough to import the package and run the smoke tests.
          # The smoke tests need no trained models, data, or API keys.
          pip install numpy pandas scikit-learn xgboost joblib python-dotenv pyyaml ruff pytest

      - name: Lint with ruff (blocking)
        env:
          PYTHONPATH: src
        run: ruff check src/ app/ tests/

      - name: Run unit tests
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
        run: pytest tests/ -q
