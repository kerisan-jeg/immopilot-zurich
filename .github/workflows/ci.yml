name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight subset: enough to import the package and run the smoke tests.
          # The smoke tests need no trained models, data, or API keys.
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 xgboost==2.1.1 joblib==1.4.2 python-dotenv==1.0.1 pyyaml==6.0.2 ruff==0.7.0 pytest==8.3.3

      - name: Lint with ruff (blocking)
        env:
          PYTHONPATH: src
        run: ruff check src/ app/ tests/

      - name: Run unit tests
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: dummy
          OPENAI_API_KEY: dummy
        run: pytest tests/ -q
