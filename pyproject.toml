[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immopilot"
version = "0.1.0"
description = "Multimodal apartment-rent assistant for Zurich"
authors = [{name = "kerisan-jeg", email = "jegatker@students.zhaw.ch"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",                      # line length handled by black
    "RUF001", "RUF002", "RUF003",  # ambiguous Unicode (–, ×, ·) in German UI strings/docstrings
    "RUF100",                    # unused noqa (BLE001 not enabled in this ruleset)
    "N803", "N806",              # X / X_train etc. are standard ML matrix names
    "E741",                      # D, I from faiss index.search are conventional
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
